<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="atlas — speech recognition and end-to-end spoken language models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="ribbonFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="0.34" stop-color="#ff6b6b"/>
      <stop offset="0.67" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .name {
        font: 700 46px 'SF Mono', 'Cascadia Code', Consolas, monospace;
        fill: #f4f7fb;
        letter-spacing: 1px;
      }
      .caret {
        fill: #f5a623;
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .type {
        clip-path: inset(0 100% 0 0);
        animation: reveal 2.2s steps(5) 0.3s forwards;
      }
      @keyframes reveal {
        to { clip-path: inset(0 0 0 0); }
      }
      .sub {
        font: 500 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        fill: #8aa0c0;
      }
      .role {
        font: 600 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        fill: #c8d4e6;
        opacity: 0;
        animation: cycle 9s infinite;
      }
      .role.r2 {
        animation-delay: 3s;
      }
      .role.r3 {
        animation-delay: 6s;
      }
      @keyframes cycle {
        0%, 4% { opacity: 0; }
        8%, 28% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      .lane {
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 7 9;
        animation: flow 2.6s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -32; }
      }
      .seg {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: left center;
        animation: segin 0.5s ease-out forwards;
      }
      @keyframes segin {
        from { opacity: 0; transform: scaleX(0.1); }
        to { opacity: 1; transform: scaleX(1); }
      }
      .cap {
        font: 500 12.5px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        fill: #67789a;
      }
      .tick {
        stroke: #24334f;
        stroke-width: 1;
      }
      .glowdot {
        animation: pulse 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulse {
        50% { transform: scale(1.5); opacity: 0.65; }
      }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)"/>

  <g stroke="#16223c" stroke-width="1">
    <line x1="0" y1="70" x2="900" y2="70" opacity="0.35"/>
    <line x1="0" y1="210" x2="900" y2="210" opacity="0.35"/>
  </g>

  <!-- left: identity -->
  <text class="sub" x="48" y="52">武汉大学  University</text>
  <g class="type">
    <text class="name" x="48" y="118">atlas</text>
  </g>
  <rect class="caret" x="190" y="82" width="3" height="42"/>
  <text class="role" x="48" y="152">语音识别 × 端到端语音大模型</text>
  <text class="role r2" x="48" y="152">speaker diarization · 多说话人会议语音</text>
  <text class="role r3" x="48" y="152">cpWER / DER / JER · 可复现离线评测</text>
  <text class="sub" x="48" y="196" style="fill:#5d6f8f">choravox — 合成会议工厂 · 植入真值 · 全离线</text>

  <!-- badge pills bottom-left -->
  <g font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">
    <rect x="48" y="222" width="74" height="24" rx="12" fill="#1b2a47" stroke="#2c3f63"/>
    <text x="85" y="238" fill="#f5a623" text-anchor="middle">Python</text>
    <rect x="130" y="222" width="74" height="24" rx="12" fill="#1b2a47" stroke="#2c3f63"/>
    <text x="167" y="238" fill="#2dd4bf" text-anchor="middle">NumPy</text>
    <rect x="212" y="222" width="90" height="24" rx="12" fill="#1b2a47" stroke="#2c3f63"/>
    <text x="257" y="238" fill="#ff6b6b" text-anchor="middle">PyTorch·CPU</text>
    <rect x="310" y="222" width="102" height="24" rx="12" fill="#1b2a47" stroke="#2c3f63"/>
    <text x="361" y="238" fill="#60a5fa" text-anchor="middle">offline-first</text>
  </g>

  <!-- right: chorus of voices converging into a diarization ribbon -->
  <g>
    <!-- four voice lanes -->
    <path class="lane" stroke="#f5a623" d="M480,64 q14,-14 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 C 676,64 700,96 726,120"/>
    <path class="lane" stroke="#ff6b6b" d="M480,104 q14,-12 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 C 676,104 700,116 726,128" style="animation-delay:-0.6s"/>
    <path class="lane" stroke="#2dd4bf" d="M480,176 q14,12 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 C 676,176 700,164 726,152" style="animation-delay:-1.2s"/>
    <path class="lane" stroke="#60a5fa" d="M480,216 q14,14 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 C 676,216 700,184 726,160" style="animation-delay:-1.8s"/>

    <!-- convergence node -->
    <circle cx="730" cy="140" r="7" fill="#f4f7fb"/>
    <circle class="glowdot" cx="730" cy="140" r="12" fill="none" stroke="#f5a623" stroke-width="2"/>

    <!-- diarization ribbon: timeline rows attributed per speaker -->
    <g>
      <line class="tick" x1="752" y1="60" x2="752" y2="222"/>
      <line class="tick" x1="796" y1="60" x2="796" y2="222"/>
      <line class="tick" x1="840" y1="60" x2="840" y2="222"/>

      <!-- row 1 -->
      <rect class="seg" x="754" y="66" width="40" height="12" rx="6" fill="#f5a623" style="animation-delay:1.6s"/>
      <rect class="seg" x="812" y="66" width="52" height="12" rx="6" fill="#2dd4bf" style="animation-delay:2.1s"/>

      <!-- row 2 -->
      <rect class="seg" x="766" y="94" width="58" height="12" rx="6" fill="#ff6b6b" style="animation-delay:1.9s"/>
      <rect class="seg" x="840" y="94" width="24" height="12" rx="6" fill="#f5a623" style="animation-delay:2.4s"/>

      <!-- row 3 (overlap row) -->
      <rect class="seg" x="754" y="122" width="30" height="12" rx="6" fill="#60a5fa" style="animation-delay:2.2s"/>
      <rect class="seg" x="790" y="122" width="46" height="12" rx="6" fill="#ff6b6b" style="animation-delay:2.6s"/>
      <rect class="seg" x="800" y="136" width="36" height="10" rx="5" fill="#2dd4bf" opacity="0.85" style="animation-delay:2.8s"/>

      <!-- row 4 -->
      <rect class="seg" x="770" y="164" width="66" height="12" rx="6" fill="#f5a623" style="animation-delay:2.5s"/>
      <rect class="seg" x="848" y="164" width="18" height="12" rx="6" fill="#60a5fa" style="animation-delay:3.0s"/>

      <!-- row 5 -->
      <rect class="seg" x="754" y="192" width="34" height="12" rx="6" fill="#2dd4bf" style="animation-delay:2.9s"/>
      <rect class="seg" x="806" y="192" width="58" height="12" rx="6" fill="#60a5fa" style="animation-delay:3.2s"/>

      <text class="cap" x="752" y="238">who spoke what when · 说话人日志</text>
    </g>

    <text class="cap" x="480" y="252">4 voice tracks → attributed transcript</text>
  </g>
</svg>
