<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="choravox journey: from audio front end to meeting reports">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#111c34"/>
    </linearGradient>
    <style>
      .t   { font: 700 20px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#f4f7fb; }
      .tr  { font: 500 13px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#8aa0c0; }
      .st  { font: 600 12.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#d6e0ee; text-anchor:middle; }
      .sd  { font: 500 10.5px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#7688a8; text-anchor:middle; }
      .pill{ font: 700 12.5px 'SF Mono',Consolas,monospace; }
      .conn { fill:none; stroke:#2a3c5e; stroke-width:2; stroke-dasharray:5 7; animation: dash 1.8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-24; } }
      .node { opacity:0; animation: pop 0.45s ease-out forwards; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { opacity:0; transform: scale(0.4);} to { opacity:1; transform: scale(1);} }
      .lbl  { opacity:0; animation: fadein 0.5s ease-out forwards; }
      @keyframes fadein { to { opacity:1; } }
    </style>
  </defs>
  <rect width="900" height="340" rx="14" fill="url(#jbg)"/>

  <text class="t" x="40" y="44">choravox · 一个仓库的两年旅程</text>
  <text class="tr" x="40" y="66">多说话人会议语音工具包 — 从音频前端到说话人归属转写与可复现报告</text>
  <text class="tr" x="860" y="44" text-anchor="end" style="fill:#f5a623">2025.01 — 2026.09</text>
  <text class="tr" x="860" y="66" text-anchor="end">520 commits · 330 in 2025</text>

  <!-- connectors: two rows, serpentine -->
  <path class="conn" d="M95,140 H770"/>
  <path class="conn" d="M790,140 C 830,140 830,236 790,236" style="animation-delay:-0.4s"/>
  <path class="conn" d="M770,236 H95" style="animation-delay:-0.8s"/>

  <!-- row 1 stations -->
  <g>
    <g class="node" style="animation-delay:0.2s"><circle cx="95" cy="140" r="16" fill="#1b2a47" stroke="#f5a623" stroke-width="2.5"/><path d="M88,140 q3.5,-8 7,0 t7,0" stroke="#f5a623" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="95" y="106" style="animation-delay:0.3s">音频前端</text>
    <text class="sd lbl" x="95" y="180" style="animation-delay:0.3s">log-mel · CMVN · 重采样</text>

    <g class="node" style="animation-delay:0.5s"><circle cx="263" cy="140" r="16" fill="#1b2a47" stroke="#ff6b6b" stroke-width="2.5"/><rect x="256" y="134" width="14" height="10" rx="2" fill="none" stroke="#ff6b6b" stroke-width="2"/></g>
    <text class="st lbl" x="263" y="106" style="animation-delay:0.6s">合成会议工厂</text>
    <text class="sd lbl" x="263" y="180" style="animation-delay:0.6s">植入真值 · RIR · 麦克风阵</text>

    <g class="node" style="animation-delay:0.8s"><circle cx="431" cy="140" r="16" fill="#1b2a47" stroke="#2dd4bf" stroke-width="2.5"/><path d="M424,144 h4 v-8 h4 v10 h4 v-6 h5" stroke="#2dd4bf" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="431" y="106" style="animation-delay:0.9s">VAD · 嵌入</text>
    <text class="sd lbl" x="431" y="180" style="animation-delay:0.9s">HMM · UBM/PLDA · EER</text>

    <g class="node" style="animation-delay:1.1s"><circle cx="599" cy="140" r="16" fill="#1b2a47" stroke="#60a5fa" stroke-width="2.5"/><circle cx="594" cy="137" r="3.4" fill="#60a5fa"/><circle cx="604" cy="143" r="3.4" fill="none" stroke="#60a5fa" stroke-width="2"/></g>
    <text class="st lbl" x="599" y="106" style="animation-delay:1.2s">说话人日志</text>
    <text class="sd lbl" x="599" y="180" style="animation-delay:1.2s">AHC · 谱聚类 · VB-HMM</text>

    <g class="node" style="animation-delay:1.4s"><circle cx="770" cy="140" r="16" fill="#1b2a47" stroke="#f5a623" stroke-width="2.5"/><path d="M763,136 h14 M763,143 h9" stroke="#f5a623" stroke-width="2.4" stroke-linecap="round"/><circle cx="777" cy="144" r="2.6" fill="#ff6b6b"/></g>
    <text class="st lbl" x="770" y="106" style="animation-delay:1.5s">重叠检测</text>
    <text class="sd lbl" x="770" y="180" style="animation-delay:1.5s">多标签 · 重叠感知 DER</text>
  </g>

  <!-- row 2 stations (right to left) -->
  <g>
    <g class="node" style="animation-delay:1.7s"><circle cx="686" cy="236" r="16" fill="#1b2a47" stroke="#ff6b6b" stroke-width="2.5"/><path d="M679,232 h14 M679,239 h14 M686,229 v14" stroke="#ff6b6b" stroke-width="1.8"/></g>
    <text class="st lbl" x="686" y="278" style="animation-delay:1.8s">SA-ASR</text>
    <text class="sd lbl" x="686" y="206" style="animation-delay:1.8s">CTC/SOT · 目标说话人</text>

    <g class="node" style="animation-delay:2.0s"><circle cx="518" cy="236" r="16" fill="#1b2a47" stroke="#2dd4bf" stroke-width="2.5"/><path d="M511,236 h5 l3,-6 l3,12 l3,-6 h4" stroke="#2dd4bf" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="518" y="278" style="animation-delay:2.1s">强制对齐</text>
    <text class="sd lbl" x="518" y="206" style="animation-delay:2.1s">Viterbi · 词级时间戳</text>

    <g class="node" style="animation-delay:2.3s"><circle cx="350" cy="236" r="16" fill="#1b2a47" stroke="#60a5fa" stroke-width="2.5"/><path d="M343,236 a7,7 0 1 1 14,0 a7,7 0 1 1 -14,0 M357,231 l4,-4" stroke="#60a5fa" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="350" y="278" style="animation-delay:2.4s">在线流式</text>
    <text class="sd lbl" x="350" y="206" style="animation-delay:2.4s">增量聚类 · 延迟核算</text>

    <g class="node" style="animation-delay:2.6s"><circle cx="182" cy="236" r="16" fill="#1b2a47" stroke="#f5a623" stroke-width="2.5"/><path d="M175,241 l5,-9 l4,6 l6,-8" stroke="#f5a623" stroke-width="2" fill="none"/></g>
    <text class="st lbl" x="182" y="278" style="animation-delay:2.7s">评测与报告</text>
    <text class="sd lbl" x="182" y="206" style="animation-delay:2.7s">cpWER · DER · JER · HTML</text>
  </g>

  <!-- stats pills -->
  <g class="lbl" style="animation-delay:3.0s">
    <rect x="40" y="300" width="118" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="99" y="317" fill="#f5a623" text-anchor="middle">520 commits</text>
    <rect x="170" y="300" width="112" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="226" y="317" fill="#2dd4bf" text-anchor="middle">1212 tests</text>
    <rect x="294" y="300" width="118" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="353" y="317" fill="#ff6b6b" text-anchor="middle">41 modules</text>
    <rect x="424" y="300" width="118" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="483" y="317" fill="#60a5fa" text-anchor="middle">4 examples</text>
    <rect x="554" y="300" width="86" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="597" y="317" fill="#d6e0ee" text-anchor="middle">v0.1.1</text>
    <rect x="652" y="300" width="208" height="26" rx="13" fill="#16233d" stroke="#2c3f63"/><text class="pill" x="756" y="317" fill="#7ee081" text-anchor="middle">逐提交 build·test·format ✓</text>
  </g>
</svg>
